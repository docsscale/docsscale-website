# Weekly dependency update pull requests, tested by CI like any other change.
# Merging still needs the owner's go-ahead (CLAUDE.md, section 1).
# Security fixes arrive as their own pull request as soon as GitHub knows of
# one; that part is switched on in the repository's settings, not here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Chicago }
    open-pull-requests-limit: 2
    groups:
      site: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      # Major versions change behaviour; they are planned work, not routine updates.
      - { dependency-name: '*', update-types: ['version-update:semver-major'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Chicago }
    open-pull-requests-limit: 2
    groups:
      test-tools: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      - { dependency-name: '*', update-types: ['version-update:semver-major'] }
  - package-ecosystem: npm
    directory: /cms
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Chicago }
    open-pull-requests-limit: 2
    groups:
      editing-app: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      - { dependency-name: '*', update-types: ['version-update:semver-major'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Chicago }
    open-pull-requests-limit: 1
    groups:
      ci-actions: { patterns: ['*'] }
