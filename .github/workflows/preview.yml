# Rebuilds the private preview site (preview.docsscale.com: password, noindex)
# whenever an editor saves in the editing screen, or the site's code changes.
# The code comes from main; the content (posts, categories, team members and
# uploaded pictures) from the working copy the editing screen saves to. Nothing
# here can reach the live site.
name: Preview site

on:
  push:
    branches: [main, content/working]
  workflow_dispatch:

permissions:
  contents: read

# One preview build at a time; a newer save replaces a build still waiting.
concurrency:
  group: preview-site
  cancel-in-progress: true

jobs:
  preview:
    name: Build and upload the preview site
    runs-on: ubuntu-latest
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      # Until the owner has added the access key, there is nothing to do.
      - name: Check for the Hostinger access key
        id: key
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "::notice::No HOSTINGER_API_TOKEN secret yet, so the preview site was not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - name: Take the content from the working copy
        if: steps.key.outputs.present == 'true'
        run: |
          git fetch origin content/working
          git checkout FETCH_HEAD -- content
          # Uploaded pictures, when the working copy has any.
          git checkout FETCH_HEAD -- web/public/uploads 2>/dev/null || true
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - if: steps.key.outputs.present == 'true'
        run: npm ci
        working-directory: web
      # Short-lived upload credentials for the preview site only. They are
      # hidden in the log and never leave this job.
      - name: Get upload credentials
        if: steps.key.outputs.present == 'true'
        run: |
          response=$(curl -sS --fail-with-body -X POST https://developers.hostinger.com/api/hosting/v1/files/upload-urls \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"username":"u145389112","domain":"preview.docsscale.com"}')
          for field in url auth_key rest_auth_key; do
            value=$(printf '%s' "$response" | node -e "process.stdin.on('data', (d) => process.stdout.write(String(JSON.parse(d)['$field'] ?? '')))")
            [ -n "$value" ] || { echo "::error::Hostinger did not return upload credentials."; exit 1; }
            echo "::add-mask::$value"
            case $field in
              url) echo "HOSTINGER_UPLOAD_URL=$value" >> "$GITHUB_ENV" ;;
              auth_key) echo "HOSTINGER_AUTH=$value" >> "$GITHUB_ENV" ;;
              rest_auth_key) echo "HOSTINGER_REST=$value" >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Build with drafts and upload
        if: steps.key.outputs.present == 'true'
        run: node scripts/deploy.mjs --target preview
      - name: Check the private addresses are still hidden
        if: steps.key.outputs.present == 'true'
        run: bash tests/server/hidden-sites.sh
