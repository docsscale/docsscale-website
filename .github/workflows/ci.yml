# Runs on every pull request and on every push to main. A pull request into main
# can only be merged when all five jobs pass (see docs/CONTRIBUTING.md → Branches).
# Not on pushes to other branches: a branch with an open pull request used to be
# tested twice per push, which used up the month's free Actions minutes
# (2,000 on the free plan) on 7 Oct 2026.
#
# Where the jobs run: GitHub's machines, unless the repository variable CI_RUNNER
# names another runner. From 7 Oct 2026 until the free minutes reset on 1 Nov it
# is set to "docsscale-mac", the runner on the owner's Mac (docs/HANDOVER.md).
# Delete the variable to go back to GitHub's machines; nothing else changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, types, format, build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # No npm cache on the Mac runner: it would upload the Mac's whole npm cache.
        with: { node-version: 22, cache: "${{ runner.environment == 'github-hosted' && 'npm' || '' }}", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # The sitemap is generated from the built pages; a page's date moves only
      # when its own copy changes. Fails if the committed files are out of date.
      - run: npm run sitemap:check
      # Brand rules, titles and descriptions, headings, alt text, links,
      # structured data, sitemap coverage; warns on short or near-duplicate pages.
      - run: npm run check:site
      - uses: actions/upload-artifact@v7
        with: { name: web-out, path: web/out, retention-days: 7 }

  server:
    name: Lead handler tests (PHP)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # The Mac runner uses the PHP already installed on it.
      - if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: none }
      - run: bash tests/server/lead-handler.sh
      - run: bash tests/server/lead-digest.sh
      # The editing site and the preview site must stay closed to the public and
      # "noindex" (asks the two live addresses; read-only).
      - run: bash tests/server/hidden-sites.sh

  audit:
    name: Dependency audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  visual:
    name: Pixel + behaviour parity with the live build
    needs: web
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "${{ runner.environment == 'github-hosted' && 'npm' || '' }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with: { name: web-out, path: web/out }
      # Both sides are captured on this runner, so OS font rendering cancels out.
      # Baseline = reference/approved/ if present, else the original live snapshot.
      - run: node tests/visual/capture.mjs --out tests/visual/ci-baseline
      - run: node tests/visual/capture.mjs --site web/out --out tests/visual/candidate
      - run: node tests/visual/compare.mjs --baseline tests/visual/ci-baseline
      - run: node tests/visual/interactions.mjs
      - run: node tests/visual/nav-behaviour.mjs
      - run: node tests/visual/form-a11y.mjs
      - run: node tests/visual/web-vitals.mjs
      - run: node tests/visual/tracking.mjs
      # Permanent (owner's decision, 4 Oct 2026): proves every lead form is masked from
      # Clarity recordings and that Clarity loads only after consent. Don't remove.
      - run: node tests/visual/clarity.mjs
      # The homepage hero graphic: complete on first paint, static under reduced
      # motion, pauses off-screen, never moves the page.
      - run: node tests/visual/hero-journey.mjs
      - run: node tests/visual/funnel-stats.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            tests/visual/diff
            tests/visual/interactions
          retention-days: 14

  performance:
    name: Performance budget
    needs: web
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "${{ runner.environment == 'github-hosted' && 'npm' || '' }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with: { name: web-out, path: web/out }
      # A lab test of every built page on a simulated phone. Existing pages are
      # held to "no worse than today", new pages to the target
      # (tests/performance/budget.json; docs/COMPLETION-PLAN.md, section 5, item 11).
      - run: node tests/performance/budget.mjs
      # The measured numbers, kept so the "today" record can be re-recorded from CI.
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: performance-results, path: tests/performance/results.json, retention-days: 30 }
