# Runs on every push and pull request. A pull request into main can only be
# merged when all four jobs pass (see docs/CONTRIBUTING.md → Branches).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, types, format, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-out, path: web/out, retention-days: 7 }

  server:
    name: Lead handler tests (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: none }
      - run: bash tests/server/lead-handler.sh
      - run: bash tests/server/lead-digest.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  visual:
    name: Pixel + behaviour parity with the live build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: web-out, path: web/out }
      # Both sides are captured on this runner, so OS font rendering cancels out.
      # Baseline = reference/approved/ if present, else the original live snapshot.
      - run: node tests/visual/capture.mjs --out tests/visual/ci-baseline
      - run: node tests/visual/capture.mjs --site web/out --out tests/visual/candidate
      - run: node tests/visual/compare.mjs --baseline tests/visual/ci-baseline
      - run: node tests/visual/interactions.mjs
      - run: node tests/visual/nav-behaviour.mjs
      - run: node tests/visual/form-a11y.mjs
      - run: node tests/visual/web-vitals.mjs
      - run: node tests/visual/tracking.mjs
      # Permanent (owner's decision, 4 Oct 2026): proves every lead form is masked from
      # Clarity recordings and that Clarity loads only after consent. Don't remove.
      - run: node tests/visual/clarity.mjs
      # The homepage hero graphic: complete on first paint, static under reduced
      # motion, pauses off-screen, never moves the page.
      - run: node tests/visual/hero-journey.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tests/visual/diff
            tests/visual/interactions
          retention-days: 14
